<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Open Graph Metadata -->
  <meta property="og:title" content="Interactive Quiz: Can You Guess the Answer?" />
  <meta property="og:description" content="Test your knowledge with this fun quiz! Click to see if you guessed the correct answer." />
  <meta property="og:image" content="https://yourwebsite.com/quiz-preview-image.jpg" />
  <meta property="og:url" content="https://alihasanfiroz.github.io/InteractiveQuiz1/" />
  <meta property="og:type" content="website" />
</head>
<body>
  <div class="quiz-container">
    <div class="question">কাকে "সবুজ গ্রহ" বলা হয়??</div>
    <div class="options">
      <button class="option" onclick="selectOption(this, true)">A. ইউরেনাস</button>
      <button class="option" onclick="selectOption(this, false)">B. মঙ্গল</button>
      <button class="option" onclick="selectOption(this, false)">C. পৃথিবী</button>
      <button class="option" onclick="selectOption(this, false)">D. শুক্র</button>
    </div>
    <div class="answer-section hidden" id="answerSection">
      <p id="answerText"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
