<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="quiz-container">
    <div class="question">What is the capital of France?</div>
    <div class="options">
      <button class="option" onclick="selectOption(this, false)">A. Berlin</button>
      <button class="option" onclick="selectOption(this, false)">B. Madrid</button>
      <button class="option" onclick="selectOption(this, true)">C. Paris</button>
      <button class="option" onclick="selectOption(this, false)">D. Rome</button>
    </div>
    <div class="answer-section hidden" id="answerSection">
      <p id="answerText"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
